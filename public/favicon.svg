<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Obsidian Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191b28" />
      <stop offset="100%" stop-color="#08090f" />
    </linearGradient>

    <!-- Vibrant Gold Radial Gradient -->
    <radialGradient id="goldGlow" cx="35%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="25%" stop-color="#ffe066" />
      <stop offset="60%" stop-color="#ffd21f" />
      <stop offset="90%" stop-color="#e5a823" />
      <stop offset="100%" stop-color="#c48a0a" />
    </radialGradient>

    <!-- Specular Highlight for Glossy Badge -->
    <radialGradient id="specular" cx="35%" cy="25%" r="45%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.85)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </radialGradient>

    <!-- Warm Golden Ambient Drop Shadow -->
    <filter id="goldShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#ffd21f" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 210, 31, 0.35)" stroke-width="1.5" />

  <!-- Centered Golden Badge Emblem -->
  <g transform="translate(32 32)">
    <!-- Outer Golden Disc with Glow -->
    <circle r="21.5" fill="url(#goldGlow)" filter="url(#goldShadow)" />
    <circle r="21.5" fill="none" stroke="rgba(255, 255, 255, 0.65)" stroke-width="1" />

    <!-- Glossy Top Shine -->
    <ellipse cx="-6" cy="-7" rx="12" ry="7.5" fill="url(#specular)" />

    <!-- Sharp Play Arrow in Deep Obsidian -->
    <path d="M -4 -11 L -4 11 L 13 0 Z" fill="#0c0d12" stroke="#0c0d12" stroke-width="1.5" stroke-linejoin="round" />
  </g>
</svg>
